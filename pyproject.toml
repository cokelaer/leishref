[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "leishref"
version = "0.1.0"
description = "Leishmania reference genome database with NCBI/TriTrypDB provenance, aliasing, and scaffolding"
authors = [{name = "Cokelaer", email = "cokelaer@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "rich-click>=1.8",
    "pydantic>=2.0",
    "requests>=2.25",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "pre-commit>=3.0",
]

[project.scripts]
leishref = "leishref.cli:cli"

[tool.poetry]
name = "leishref"
version = "0.1.0"
description = "Leishmania reference genome database"
authors = ["Cokelaer <cokelaer@gmail.com>"]
readme = "README.md"
packages = [{include = "leishref"}]
# The curated catalog ships with the package: leishref is the single entry point.
include = [{path = "leishref/data/**/*.yaml", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
python = "^3.9"
rich-click = "^1.8"
pydantic = "^2.0"
requests = "^2.25"
pyyaml = "^6.0"
tqdm = "^4.60"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^23.0"
isort = "^5.0"
flake8 = "^6.0"
pre-commit = "^3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio in the ambient conda env is incompatible with this pytest and
# breaks collection on import; nothing here is async.
addopts = "-p no:asyncio"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E501", "W503", "E722"]
