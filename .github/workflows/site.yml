name: Publish catalog page

# Rebuilds catalog.json and publishes leishref-web/ with GitHub Pages.
# Served at https://leishome.github.io/leishref/ (project site under the org site).

on:
  push:
    branches: [main]
    paths: ["leishref/data/**", "leishref/metadata.py", "leishref-web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          pip install .
          mkdir _site
          python leishref-web/build_catalog.py _site/catalog.json
          cp leishref-web/index.html leishref-web/catalog.js leishref-web/style.css leishref-web/logo.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
